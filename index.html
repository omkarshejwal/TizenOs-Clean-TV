<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CleanHome - Clean TV Launcher</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Pre-blurred Hero Background Crossfade Layers (100vw x 100vh) -->
    <div id="bg-layer-0" class="hero-bg-layer active"></div>
    <div id="bg-layer-1" class="hero-bg-layer"></div>

    <!-- Scaled UI Stage (1920x1080 design space, scales proportionally to fill viewport) -->
    <div id="stage">
      <!-- Top Bar: Greeting, Clock, Date on left; ONE frosted pill on right -->
      <div id="top-bar" role="banner">
        <div class="top-bar-left">
          <div class="greeting" id="greeting">GOOD EVENING</div>
          <div class="clock-date-row">
            <div class="clock" id="clock">12:00</div>
            <div class="ampm" id="ampm">PM</div>
            <div class="clock-divider"></div>
            <div class="date-block">
              <div class="date-text" id="date">SUN, 25 OCT</div>
            </div>
          </div>
        </div>

        <!-- Top-Right ONE frosted-glass pill (Wi-Fi, Weather, Profile Avatar) -->
        <div class="top-bar-right">
          <div id="top-pill" class="top-pill" role="button" aria-label="Quick Status and Settings" tabindex="0">
            <div class="pill-icon pill-wifi" id="pill-wifi" title="Network status">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.23 1.48 9.8 3.91L12 18.2 2.2 11.41C4.77 8.98 8.22 7.5 12 7.5z"/>
              </svg>
            </div>
            <div class="pill-icon pill-weather hidden" id="pill-weather" title="Weather">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
              </svg>
            </div>
            <div class="pill-avatar" id="pill-avatar" title="Settings Profile">C</div>
          </div>
        </div>
      </div>

      <!-- Middle Area: Hero Text Block on left, Optional Poster on right -->
      <div id="hero-container">
        <div id="hero-block">
          <div id="hero-label" class="hero-label">OPEN</div>
          <div id="hero-title" class="hero-title">Netflix</div>
          <div id="hero-subtitle" class="hero-subtitle"></div>
        </div>

        <div id="hero-poster-container" class="hero-poster-container hidden">
          <img id="hero-poster-img" class="hero-poster-img" decoding="async" alt="App poster" />
        </div>
      </div>

      <!-- Bottom Frosted Dock Bar with Grouped Tiles -->
      <div id="dock-container">
        <div id="dock-bar" class="dock-bar">
          <div id="dock-track" class="dock-track" role="grid" aria-label="Application Tiles">
            <!-- Dynamically populated with grouped app tiles, separators, and Settings -->
          </div>
        </div>
        <div id="group-labels-row" class="group-labels-row">
          <!-- Dynamically populated with group labels ("Apps", "Media", "Music") left-aligned under first tile -->
        </div>
      </div>
    </div>

    <!-- Settings Dialog Modal (Full focusable rows list) -->
    <div id="settings-dialog" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="settings-panel">
        <div class="settings-header">
          <h2 class="settings-title">Settings</h2>
          <span class="settings-subtitle">Remote Up/Down to navigate, OK to change, Back to return</span>
        </div>
        <div class="settings-list" id="settings-list" role="menu">
          <!-- Rows populated dynamically by JS:
               1. Reduced motion: ON / OFF
               2. Clock format: 12h / 24h
               3. Wallpaper: Open picker...
               4. Rich effects: ON / OFF (default OFF on TV)
               5. Re-scan installed apps
          -->
        </div>
      </div>
    </div>

    <!-- App Library Dialog Popup (Yellow key) -->
    <div id="app-library-dialog" role="dialog" aria-modal="true" aria-label="App Library">
      <div class="library-panel">
        <div class="library-header">
          <span class="library-title">App library</span>
          <span class="library-count" id="library-count">8 apps</span>
        </div>
        <div class="library-hint" id="library-hint">OK: Open</div>
        <div class="library-shelf">
          <div class="library-cards-track" id="library-cards-track">
            <!-- Populated dynamically by JS with child glass highlight -->
          </div>
        </div>
      </div>
    </div>

    <!-- Wallpapers Dialog (Blue key) -->
    <div id="wallpapers-dialog" role="dialog" aria-modal="true" aria-label="Wallpapers">
      <div class="wallpapers-panel">
        <div class="wallpapers-header">
          <h2>Wallpapers</h2>
          <span style="font-size: 24px; color: rgba(255,255,255,0.6);">Select with OK, Back to return</span>
        </div>
        <div class="wallpapers-grid" id="wallpapers-grid">
          <!-- Populated dynamically by JS -->
        </div>
      </div>
    </div>

    <!-- Clock Screensaver (drifting clock during idle in rich mode, static in lite mode) -->
    <div id="screensaver">
      <div class="screensaver-content" id="screensaver-content">
        <div class="screensaver-clock" id="screensaver-clock">12:00</div>
        <div class="screensaver-date" id="screensaver-date">SUN, 25 OCT</div>
      </div>
    </div>

    <!-- Global error display panel for TV -->
    <div id="error-panel" class="error-panel hidden" role="alert"></div>

    <!-- Small debug line overlay (toggled by Red key) -->
    <div id="debug-line" class="debug-line hidden" aria-live="polite"></div>

    <!-- Toast notification container -->
    <div id="toast-container"></div>
  </div>

  <script src="js/motion-config.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/launcher.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
